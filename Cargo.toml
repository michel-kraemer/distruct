[package]
name = "distruct"
authors = ["Michel Kraemer <michel@undercouch.de>"]
description = "Raft-based cluster coordination and strongly consistent distributed data structures"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/michel-kraemer/distruct"
keywords = ["raft", "consistency", "cluster", "distributed"]
categories = ["network-programming", "data-structures", "asynchronous"]

[dependencies]
dashmap = "6.2.1"
log = "0.4.34"
openraft = { version = "0.9.25", features = ["serde", "storage-v2"] }
postcard = { version = "1.1.3", features = ["alloc"] }
quinn = "0.11.11"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
tokio = { version = "1.54.0", features = ["macros", "net", "parking_lot", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
ulid = { version = "3.0.0", features = ["serde"] }

[workspace]
members = ["examples/simple-app"]
